name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ["podcast_transcriber/**", "tests/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only pytest is needed: the heavy ML packages are imported lazily.
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q
